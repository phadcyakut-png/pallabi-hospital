name: Build and deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install Pillow==11.3.0

      # One-time, upload-only update. No terminal required for the site owner.
      - name: Apply the leadership and Photo Cards update
        if: ${{ hashFiles('pallabi-update-assets.zip') != '' }}
        run: |
          python -m zipfile -e pallabi-update-assets.zip .pallabi-update
          python .pallabi-update/apply_leadership_update.py .
          python .pallabi-update/apply_gallery_update.py .

      - name: Prepare website images
        run: python scripts/prepare_images.py

      - name: Generate website
        run: python build.py

      - name: Verify both updates
        if: ${{ hashFiles('pallabi-update-assets.zip') != '' }}
        run: |
          python .pallabi-update/verify_leadership_pages.py .
          python .pallabi-update/verify_gallery_update.py .

      # Save the final, real site files to the repository, then delete the
      # temporary update ZIP so this code is not reapplied on future builds.
      - name: Save updated source and website files
        if: ${{ hashFiles('pallabi-update-assets.zip') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm pallabi-update-assets.zip
          git add -A -- build.py content/hospital.json content/photocards.json scripts/prepare_images.py site/assets/style.css site/assets/app.js README.md CONTENT_TODO.md source-images site pallabi-update-assets.zip
          if git diff --cached --quiet; then
            echo "No new source changes to save."
          else
            git commit -m "Keep Papry Rahman as sole leader and add 14 gallery photo cards"
            if git push origin HEAD:main; then
              echo "Updated source files saved to main."
            else
              echo "::warning::GitHub rejected the automatic source commit. The current website can still deploy, but check branch permissions."
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        name: Deploy website
        uses: actions/deploy-pages@v4
